name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  consumer:
    # The release archive must load with //... for a consumer: tests/
    # (dev-only loads) are export-ignore'd. Org sweep, cf. rules_kubectl#5.
    name: consumer query (ubuntu-latest, git archive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true

      # Ubuntu 24.04+ restricts unprivileged user namespaces, which
      # Bazel's linux-sandbox needs.
      - name: Allow unprivileged user namespaces (linux-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # #4: replay (and this repo's fixture worker) use the temporalio pinned
      # in private/requirements_lock.txt on a hermetic interpreter. Fail if
      # the host could stand in for it.
      - name: Verify NO host temporalio
        run: |
          set -euo pipefail
          if python3 -c 'import temporalio' 2>/dev/null; then
            echo "FAIL: host python3 imports temporalio; the hermetic replay check would be meaningless" >&2
            exit 1
          fi
          echo "OK — host python3 has no temporalio"

      - name: Consumer check
        run: .github/consumer/check.sh "$RUNNER_TEMP/consumer"

  analysis:
    name: bazel test (ubuntu-latest, hermetic temporal.version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-analysis
          repository-cache: true

      # Ubuntu 24.04+ restricts unprivileged user namespaces, which
      # Bazel's linux-sandbox needs.
      - name: Allow unprivileged user namespaces (linux-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # #4: replay (and this repo's fixture worker) use the temporalio pinned
      # in private/requirements_lock.txt on a hermetic interpreter. Fail if
      # the host could stand in for it.
      - name: Verify NO host temporalio
        run: |
          set -euo pipefail
          if python3 -c 'import temporalio' 2>/dev/null; then
            echo "FAIL: host python3 imports temporalio; the hermetic replay check would be meaningless" >&2
            exit 1
          fi
          echo "OK — host python3 has no temporalio"

      # v0.5+: rules_temporal's own MODULE.bazel uses
      # `temporal.version(["1.7.0"])` so the toolchain materializes
      # from GitHub-releases tarballs at the pinned shas — no host
      # install needed. Verify nothing's on PATH so a regression in
      # the hermetic path can't be masked by an accidental host
      # install on the runner.
      - name: Verify NO host temporal CLI on PATH
        run: |
          set -euo pipefail
          if command -v temporal >/dev/null 2>&1; then
            echo "FAIL: temporal found at $(command -v temporal); hermetic test would be meaningless" >&2
            exit 1
          fi
          echo "OK — no host temporal CLI; hermetic mode test is meaningful"

      # `bazel build //...` analyzes ALL platforms' temporal_binary
      # toolchain repos, including darwin which can't be downloaded
      # on a linux runner without a sha-matched tarball. Target
      # specific paths instead. Same lesson rules_spicedb / rules_pg
      # learned.
      - name: bazel build (linux + smoke targets)
        run: |
          bazel build \
            //:temporal_default \
            //tests/install_smoke:smoke_test

      # v0.8+ (#4): every test runs, including the worker-backed and
      # replay tests: their temporalio is the pinned @rules_temporal_pypi
      # one, not the host's (checked above). install_smoke is manual.
      - name: bazel test //tests/...
        run: bazel test //tests/... --test_output=errors

      # The replay tests again, never from the (disk-)cache, with their
      # logs, so this run shows replays executing with the pinned SDK.
      - name: bazel test replay tests (uncached, logs)
        run: |
          bazel test \
            //tests/replay/... \
            //tests:temporal_replay_test \
            --nocache_test_results \
            --test_output=all

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-analysis
          path: bazel-testlogs/
          if-no-files-found: ignore

  install_smoke:
    # Full E2E install smoke: kind + cert-manager + temporal-operator
    # + TemporalCluster (postgres-backed) + TemporalNamespace +
    # host-side hello_worker (Python) + `temporal workflow execute`.
    name: install smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-install-smoke
          repository-cache: true

      # Ubuntu 24.04+ restricts unprivileged user namespaces, which
      # Bazel's linux-sandbox needs.
      - name: Allow unprivileged user namespaces (linux-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # #4: replay (and this repo's fixture worker) use the temporalio pinned
      # in private/requirements_lock.txt on a hermetic interpreter. Fail if
      # the host could stand in for it.
      - name: Verify NO host temporalio
        run: |
          set -euo pipefail
          if python3 -c 'import temporalio' 2>/dev/null; then
            echo "FAIL: host python3 imports temporalio; the hermetic replay check would be meaningless" >&2
            exit 1
          fi
          echo "OK — host python3 has no temporalio"

      # The install smoke uses the temporal CLI host-side to execute
      # workflows against the port-forwarded Frontend gRPC. That's
      # SEPARATE from rules_temporal's toolchain (which is now
      # hermetic via temporal.version() — see the `analysis` job).
      # The smoke's host CLI is a smoke-test-fixture concern, not a
      # rules_temporal-consumer concern.
      - name: Install temporal CLI (smoke fixture, not toolchain)
        run: |
          set -euo pipefail
          curl -sSf https://temporal.download/cli.sh | sh
          sudo cp ~/.temporalio/bin/temporal /usr/local/bin/temporal
          temporal --version

      - name: Verify Docker is available
        run: docker version

      # v0.8+ (#4): no `pip install temporalio` — the smoke's worker is
      # the //tests:hello_worker_bin py_binary with the pinned SDK.

      - name: bazel test //tests/install_smoke:smoke_test
        # kind boot (~30s) + cert-manager install (~60s) +
        # temporal-operator install (~30s) + postgres pull (~80MB) +
        # TemporalCluster reconciliation (4 services, ~2 min) +
        # TemporalNamespace registration + workflow execution.
        # Bumped beyond the typical 900s for the cluster
        # reconciliation.
        run: bazel test //tests/install_smoke:smoke_test --test_output=streamed --test_timeout=1800

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-install-smoke
          path: bazel-testlogs/
          if-no-files-found: ignore

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analysis:
    name: bazel test (ubuntu-latest, hermetic temporal.version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-analysis
          repository-cache: true

      # v0.5+: rules_temporal's own MODULE.bazel uses
      # `temporal.version(["1.7.0"])` so the toolchain materializes
      # from GitHub-releases tarballs at the pinned shas — no host
      # install needed. Verify nothing's on PATH so a regression in
      # the hermetic path can't be masked by an accidental host
      # install on the runner.
      - name: Verify NO host temporal CLI on PATH
        run: |
          set -euo pipefail
          if command -v temporal >/dev/null 2>&1; then
            echo "FAIL: temporal found at $(command -v temporal); hermetic test would be meaningless" >&2
            exit 1
          fi
          echo "OK — no host temporal CLI; hermetic mode test is meaningful"

      # `bazel build //...` analyzes ALL platforms' temporal_binary
      # toolchain repos, including darwin which can't be downloaded
      # on a linux runner without a sha-matched tarball. Target
      # specific paths instead. Same lesson rules_spicedb / rules_pg
      # learned.
      - name: bazel build (linux + smoke targets)
        run: |
          bazel build \
            //:temporal_default \
            //tests/install_smoke:smoke_test

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-analysis
          path: bazel-testlogs/
          if-no-files-found: ignore

  install_smoke:
    # Full E2E install smoke: kind + cert-manager + temporal-operator
    # + TemporalCluster (postgres-backed) + TemporalNamespace +
    # host-side hello_worker (Python) + `temporal workflow execute`.
    name: install smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-install-smoke
          repository-cache: true

      # The install smoke uses the temporal CLI host-side to execute
      # workflows against the port-forwarded Frontend gRPC. That's
      # SEPARATE from rules_temporal's toolchain (which is now
      # hermetic via temporal.version() — see the `analysis` job).
      # The smoke's host CLI is a smoke-test-fixture concern, not a
      # rules_temporal-consumer concern.
      - name: Install temporal CLI (smoke fixture, not toolchain)
        run: |
          set -euo pipefail
          curl -sSf https://temporal.download/cli.sh | sh
          sudo cp ~/.temporalio/bin/temporal /usr/local/bin/temporal
          temporal --version

      - name: Verify Docker is available
        run: docker version

      # Worker (tests/workers/hello_worker.py) imports the
      # `temporalio` Python SDK. The smoke invokes it via system
      # `python3`. Install system-wide (not --user): bazel test
      # scrubs HOME for the test action, so packages in
      # ~/.local/lib/pythonX.Y/site-packages are invisible to the
      # spawned worker. PEP 668 requires --break-system-packages on
      # newer runners — the runner is ephemeral so the impact is
      # nil.
      - name: Install temporalio Python SDK
        run: |
          set -euo pipefail
          # `--ignore-installed` skips pip's attempt to uninstall
          # debian-managed typing_extensions (which has no RECORD
          # file and would abort the install).
          sudo python3 -m pip install --break-system-packages --ignore-installed \
              'temporalio>=1.7,<2'
          python3 -c 'import temporalio; print("temporalio", temporalio.__version__)'

      - name: bazel test //tests/install_smoke:smoke_test
        # kind boot (~30s) + cert-manager install (~60s) +
        # temporal-operator install (~30s) + postgres pull (~80MB) +
        # TemporalCluster reconciliation (4 services, ~2 min) +
        # TemporalNamespace registration + workflow execution.
        # Bumped beyond the typical 900s for the cluster
        # reconciliation.
        run: bazel test //tests/install_smoke:smoke_test --test_output=streamed --test_timeout=1800

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bazel-testlogs-install-smoke
          path: bazel-testlogs/
          if-no-files-found: ignore
